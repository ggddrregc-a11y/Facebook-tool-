<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Remix AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0f1117;
            color: #e8eaf6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }

        .bg-orb-1 {
            width: 400px; height: 400px;
            background: #6c63ff;
            top: -100px; right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .bg-orb-2 {
            width: 300px; height: 300px;
            background: #4ecdc4;
            bottom: -80px; left: -80px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        .login-container {
            width: 420px;
            background: #1e2130;
            border: 1px solid #2d3148;
            border-radius: 24px;
            padding: 48px 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon-big {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6c63ff, #4ecdc4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(108,99,255,0.4);
        }

        .login-logo h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .login-logo p {
            font-size: 13px;
            color: #8892b0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #8892b0;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #5c6480;
            font-size: 15px;
        }

        .form-input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            background: #0f1117;
            border: 1px solid #2d3148;
            border-radius: 12px;
            color: #e8eaf6;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            direction: rtl;
        }

        .form-input:focus {
            outline: none;
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
        }

        .form-input::placeholder { color: #5c6480; }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff, #8b85ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(108,99,255,0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error {
            background: rgba(255,107,107,0.1);
            border: 1px solid rgba(255,107,107,0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 11px;
            color: #5c6480;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="login-container">
        <div class="login-logo">
            <div class="logo-icon-big">🤖</div>
            <h1>Remix AI</h1>
            <p>نظام الرد التلقائي على فيسبوك</p>
        </div>

        <div id="alert" class="alert-error" style="display:none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alert-message"></span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="أدخل اسم المستخدم"
                        required
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="أدخل كلمة المرور"
                        required
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>

        <div class="login-footer">
            Remix AI Auto Reply System &copy; 2024
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const alert = document.getElementById('alert');

            alert.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div><span>جارٍ تسجيل الدخول...</span>';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    showError(data.detail || 'فشل تسجيل الدخول');
                }
            } catch (err) {
                showError('خطأ في الاتصال بالخادم');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول</span>';
            }
        }

        function showError(msg) {
            const alert = document.getElementById('alert');
            document.getElementById('alert-message').textContent = msg;
            alert.style.display = 'flex';
        }
    </script>
</body>
</html>
